# Build config for the REDESIGN Railway environment (redesign branch).
# It builds the React app (frontend-next → frontend-next/dist) and runs the existing
# FastAPI app, which serves that build at /next. The production (main) environment does
# not use this file's Node steps — it has no frontend-next — but the steps are no-ops
# there anyway. Verify/iterate on the first deploy of the redesign environment.
providers = ["python"]

[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "pip install -r backend/requirements.txt",
  "npm --prefix frontend-next install",
]

[phases.build]
cmds = ["npm --prefix frontend-next run build"]

[start]
cmd = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
